<div id="game-review-controls" class="game-review-controls" role="group" aria-label="Level review" hidden>
  {% for level in site.game.levels %}
  <div data-review-world="{{ loop.index0 }}" hidden>
    {% if level.sublevels | length > 2 or level.mechanic == 'apoc-express' %}
    <label for="review-scenario-{{ loop.index0 }}">Playable scenario</label>
    <select id="review-scenario-{{ loop.index0 }}" data-review-scenario>
      {% if level.mechanic == 'apoc-express' %}
      <option value="0">Upgrade workshop</option>
      {% for seconds in level.sublevels[1].stage_seconds %}
      <option value="{{ loop.index }}">Reach the Sea · Stream {{ loop.index }}</option>
      {% endfor %}
      {% for seconds in level.sublevels[1].stage_seconds[:-1] %}
      <option value="{{ level.sublevels[1].stage_seconds | length + loop.index }}">Upgrade choice {{ loop.index }}</option>
      {% endfor %}
      <option value="{{ level.sublevels[1].stage_seconds | length * 2 }}">Difficulty and stream selection</option>
      {% else %}
      {% for sub in level.sublevels[1:] %}
      <option value="{{ loop.index0 }}">Puzzle {{ loop.index }}</option>
      {% endfor %}
      {% endif %}
    </select>
    <button type="button" data-review-play>Load</button>
    {% if level.mechanic == 'apoc-express' %}
    <button type="button" data-review-practice>Fight with upgrades</button>
    {% endif %}
    {% endif %}
    <label for="review-sound-{{ loop.index0 }}">Sound</label>
    <select id="review-sound-{{ loop.index0 }}">
      {% for method, name in level.review_sounds %}
      <option value="{{ method }}">{{ name }}</option>
      {% endfor %}
    </select>
    <button type="button" data-review-sound="review-sound-{{ loop.index0 }}">Play sound</button>

  </div>
  {% endfor %}
  <button id="game-review-next" type="button">Continue</button>
</div>
