- id: shooter-demo
  title: Shooter Demo
  role: Personal project
  thumbnail: hobby/shooter-demo/thumbnail

  # EDIT: one or two sentences about this project.
  summary: |
    A sandbox for shooter mechanics, animation blending, and ECS, with no game around it.

  # EDIT: tech used.
  tags: [Unreal Engine, C++, ECS]

  # EDIT: what the project is, and why you started it.
  overview:
    - |
      Created as a project to explore third-person shooting mechanics, ECS, and combining animations for omnidirectional running and shooting. There are some unique challenges to making a third-person shooter feel realistic and good, and it was very interesting to tackle these issues. For instance, the walking animation should have good ground traction in all directions, and the projectile trajectory should look realistic for both hip fire and ADS. It was fun to do the projectile calculations; I felt like a NASA scientist for a bit.\n
      By the end I even picked up materials for a bit and made a neat circular crosshair... a circle hair... Anyway, it ended up working really well, and I'm happy with it and its potential.

  # EDIT: the real stack.
  technologies: 
    - Unreal Engine 5
    - C++
    - Visual Studio
    - Materials

  # EDIT: goals, features being explored.
  goals:
    - Ballistic projectiles that are shot from the weapon towards the point where the crosshair is aiming
    - Blending animations for the legs (walking) and torso (shooting)
    - ADS system that modifies the camera angle and shooting accuracy
    - Modular design using ECS allowing for faster production of different similar entities

  features:
    - media: hobby/shooter-demo/contributions/ballistics2
      title: Ballistics
      text: |
        I wanted the projectiles to be ballistic, and I wanted to see them flying from the gun to where I was aiming. For this I had to calculate the bullet's trajectory from the start point (gun muzzle) to the target point (line trace from the crosshair). Once the trajectory was calculated it was a simple matter of instantiating the bullet with these parameters, and letting it fly.

    - media: hobby/shooter-demo/contributions/ads
      title: ADS
      text: |
        Since this is a third-person shooter, the ADS camera doesn't become an FPS camera. Instead, it comes over the character's shoulder and reduces the FOV. This has a smooth animation and triggers UI elements to update. Aiming down sights is very accurate, and hip fire introduces randomness to the trajectory.

    - media: hobby/shooter-demo/contributions/anim-blend
      title: Animation Blending
      text: |
        I wanted the legs to run, and the torso to aim and shoot, but I had separate animations for each. By using animation blueprints I was able to blend these two animations and use both on the same model, where the shooting animation controls the torso and the walking animation controls the legs. By using 2D blendspaces for the leg animation, I was able to support omnidirectional animated walking and crouching.\n 
        Unfortunately the free animation pack I was using only had 4 cardinal directions of movement, so the forward-left blend ended up looking a little weird, but the other directions worked great.\n
        Also I dipped into programmatically controlling the animation, adding another layer of blending. This was done to curve the spine as the player looks up and down, so he always faces screen forward.

    - media: hobby/shooter-demo/contributions/ui
      title: Custom UI 
      text: |
        Created a simple lightweight crosshair widget to help with aiming and give more visual feedback on the accuracy. I went with the circle design because I've always preferred that style, and it does a better job of representing where your bullets might land.\n
        This crosshair doesn't have a source image, only a material; it is procedurally rendered, so modifying its material, radius, feather, color, and opacity can be done on the fly, and tweaking a little more can even produce some interesting shapes. Further, the resizing is controlled by the player's ADS animation and the maximum radius is determined by the character's accuracy stat, so the player state, camera and UI are perfectly in sync.

    - media: hobby/shooter-demo/contributions/ecs
      title: ECS
      text: |
        As I was finishing the character, I realized that I could potentially develop this game further in the future and add more character variety. For this it would be practical to modularize some elements, so I decided to extract the aiming and shooting functionality into some entity components. Now each character only needs to add these components, plug in all the wires, and it has all the gear it needs ready to go. Nice!

    - media: hobby/shooter-demo/contributions/tower
      title: Enemy Towers
      text: |
        Finally I wanted to make a tower with a gun to have fun with targeting. When the tower has no target it just swivels randomly in a 'search' pattern. As soon as a character enters the tower's range, it gets tracked and shot at. Running around helps dodge the bullets once you're at a certain distance, but your best bet is just to shoot it down.

- id: shaders-unity
  title: Shader 'n' Shapes in Unity
  role: Personal project
  thumbnail: hobby/shaders-unity/thumbnail

  # EDIT: one or two sentences about this project.
  summary: |
    Having fun with shaders and shapes.

  # EDIT: tech used.
  tags: [Unity Engine, C#, URP, HLSL]

  # EDIT: what the project is, and why you started it.
  overview:
    - |
      I wanted to dip my toes into shaders, some online tutorials led me to try out Unity's URP , and in the end I wrote my own shaders in HLSL because I didn't like doing things in the graph, but the end results look pretty much the same. The animations were made in C# by manipulating cube-points' positions using complex wave functions. Note: I'm using the term 'wave function' here a lot to talk about sine waves and more complex wave functions, nothing to do with quantum mechanics in case any quantum physicists are reading.\n
      Anyway, the project ended up being very fun and instructive, and I got to make some beautiful mathematical shapes to tickle your brain :)\n

  # EDIT: the real stack.
  technologies: 
    - Unity Engine
    - C#
    - Shader Graph
    - HLSL

  # EDIT: goals, features being explored.
  goals:
    - Make a shader material for a heat map
    - Make cool shapes

  features:
    - media: hobby/shaders-unity/contributions/material
      title: Making the Material
      text: |
        To have a good visualization of how the points are moving, I wanted to introduce a material that changes color based on its position. The X, Y, and Z coordinates are mapped to the output colors R, G, and B values. This places a virtual clipping cube centered at the origin, with opposite vertices at (a,b,c) and (A,B,C), where a, b, c, A, B, C can be adjusted to accomodate any size box. Without a scaling solution in place this whould be limited to a 2x2x2 box ( (-1,-1,-1) to (1,1,1) ). Anything outside the box is clamped to the edge value of the box. This was fairly simple and can be done in a shader graph or HLSL, I went for the latter mainly for the scaling feature.\n
        Putting the material on a cube allows us to see this effect happen in real time.

    - media: hobby/shaders-unity/contributions/sine
      title: Simple Sine
      text: |
        Okay, the color itself isn't that interesting. I started experimenting with placing the now tiny cube-points in a line and moving them using a simple sine wave.\n
        By tweaking the sine function we can manipulate the shape of the resulting curve to get interesting effects.

    - media: hobby/shaders-unity/contributions/sine-2d
      title: Complex Sine
      text: |
        We can also extend this to the 3^^rd^^ dimension by making a plane of points and manipulating them with perpendicular wave functions. Complex wave functions produce some interesting shapes.

    - media: hobby/shaders-unity/contributions/surface
      title: Surfaces
      text: |
        The surface manipulation is hypnotic to me for some reason. I love watching the simulation run. More complex functions are used here, and different wave functions can even be overlapped.

    - media: hobby/shaders-unity/contributions/sphere
      title: Going 3D
      text: |
        If you thought the last one was hypnotic, this is gonna blow you away. By doing some math magic I was able to make some amazing 3D geometry animations.

    - media: hobby/shaders-unity/contributions/torous
      title: More 3D
      text: |
        Finally, everyone's favorite shape - the Torus! I added some random noise at the end for an interesting effect. What else is there to say, enjoy the visuals.