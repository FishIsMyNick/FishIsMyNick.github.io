# ============================================================================
#  Hobby projects — the second shelf under "My work".
#
#  Same row in My work as the professional projects, but a longer detail page:
#      overview      -> paragraphs on the left
#      goals         -> "What I'm working on", on the right
#      technologies  -> badges under them
#      features      -> picture + text rows under the technologies
#      gallery       -> optional 3D models at the bottom, each in a viewer
#                       you can turn with the mouse or a finger:
#                         - model: hobby/<id>/<name>   (.glb or .gltf in media/)
#                           title: shown under it        (optional)
#                           text: a line about it        (optional)
#                           poster: a picture shown while it loads (optional)
#                           zoom: false  the wheel scrolls the page over it
#                                        (by default it zooms the model in and
#                                        out, with a reset button top left)
#                           play: Idle   the animation it plays, if the file has
#                                        any (default: Idle, else the first)
#                       Or, for an animated model, `animation:` in place of
#                       `model:` shows every animation in the file as a button
#                       under it; pressing one plays it:
#                         - animation: hobby/<id>/<name>
#                           animations:          (optional: only these, in this
#                             - Idle               order, by their names in the
#                             - Walk               file; leave it out for all)
#      links         -> optional reference badges under the overview, same as
#                       in professional.yaml: { label, url } or just a url,
#                       plus `rating: a/b` for a rating badge
#
#  Pictures live in media/hobby/<id>/ and are named here without their
#  extension: hobby/combat-demo/thumbnail finds thumbnail.jpg, .jpeg, .png,
#  .webp or .avif. An .mp4 of the same name plays on hover. `thumbnail` is
#  the picture in the project's row in My work. A name ending in / is a
#  folder: every picture directly in it, in filename order, each fading
#  over the last (hobby/<id>/features/ui/).
#
#  `id` is the project's URL (…#infernal-dante), unique across every project.
#  To add a project, copy one block.
# ============================================================================

- id: infernal-dante
  title: Infernal Dante
  role: Unreal Engine, in development
  thumbnail: hobby/infernal-dante/thumbnail

  summary: |
    
    A roguelite exploration/fighting game I'm building to get character movement, animation and
    ability-driven combat working as one loop.

  tags: [Unreal Engine 5.5.4, C++, Blender, Modeling, Animation]

  # One list item per paragraph.
  overview:
    - |
      Infernal Dante is my ongoing Unreal project. The gameplay is written in C++,
      and Blueprint.
    - |
      The project is a roguelite exploration/fighting game following a small Italian greyhound protagonist, with a focus on exploration, movement and combat. The player will explore a (hopefully) procedurally generated world, fighting enemies and collecting loot to improve their character.
    - |
      For this project I'm tackling many problems at once: narrative, modeling, rigging, animation, input, movement, abilities, music and sound design, and the flow between them in order to get a better feel for the entire development pipeline and the various disciplines involved in making a game.
      Each of these areas is a learning experience, and the project is a sandbox for me to explore them in a way that lets me see the results immediately. Most importantly I'm trying to have fun with it.
    -
      |
      The project is still in its very early stages, and I'm currently focusing on getting the movement and combat systems working together. Once I have a solid foundation, I'll be able to iterate on the gameplay and narrative, and add more content to the game.

  technologies:
    - Unreal Engine 5.5.4
    - C++
    - Visual Studio
    - Blueprint
    - Gameplay Ability System
    - Enhanced Input
    - Blender

  goals:
    - Satisfying and fun character movement, with terrain interaction providing a responsive feel
    - Setting up the Gameplay Ability System and the flow between abilities and stats
    - Hitbox-based combat with action camera
    - Animation montages with notify-driven traces for hit detection
    - Enhanced Input mappings for every player action handled in C++
    - Setting up the model, rig and animation pipeline between Blender and Unreal
    - Hands-on experience with the entire game development pipeline, from concept to playable prototype
    - Have fun with it!

  features:
    - title: Modeling
      media: hobby/infernal-dante/model
      text: |
        First and foremost, we need a protagonist. I got into Blender, watched a few tutorials, and came up with this little guy. Isn't he adorable...

    - media: hobby/infernal-dante/animation
      title: Movement and Animation
      text: |
        For the very start of the project I focused on getting the main character moving, as this would help me get a feel for the movement mechanics. It's important to have the movement feel deliberate and stick to the theme of a little speedy demon. I also wanted to get a feel for the workflow between Blender and Unreal, so I could iterate on the character's movement and animations quickly.\n
        Initially I created animations for idle, walking, running, sprinting, and jumping vertically and horizontally. Both the movement and jumping animations were then used to make 1D Blend Spaces in UE5, and the Blend Spaces were used to blend between these animations based on the character's speed.

    #- media: hobby/infernal-dante/abilities
    #  title: Abilities, animation and combat
    #  text: |        
    #    An encounter where the player uses an attack ability. The animation notifies the ability to trace the hit at the right time, and the ability handles the hit detection and damage/effect application. This is a good example of how the Gameplay Ability System can be used to handle complex interactions between abilities and animations. The result is a system that is flexible to any changes in the animation, while keeping the execution timings on point.

    - media: hobby/infernal-dante/movement
      title: Fun movement
      text: |
        I'm currently working on making the movement feel better by introducing inertia, obstacles, and adaptive foot placement. It's still in its very early stages, so there's nothing to show yet.

  gallery:
    - title: 3D Model
      model: hobby/infernal-dante/gallery/models/dante3
      text: |
        A rough model of a teacup Italian Greyhound. A Tiggy™, if you will. (And yes, they exist). It's deffinetly not perfect and the paint job is kinda rough, but considering this was my first ever modeling project and I wanted to do it as quickly as possible, I'm happy with how it turned out. The proportions may look a little out of whack, but it's just a very small dog. In reality, the head and eyes are only slightly exaggerated for maximum cuteness.

    #- title: Animations
    #  animation: hobby/infernal-dante/gallery/showcase/dante-anim
      #animations:
      #  - Idle
      #  - Walk
      #  - Run
      #  - Gallop
      #  - JumpVert
      #  - FallingVert
      #  - JumpHor
      #  - FallingHor
     # text: |
      #  Again, not the best animation I'm sure, but it was my first attempt and I didn't want to lose too much time on perfecting this cause of other priorities. These are all the animations I made.



